<script>
(function() {
  var toggle = document.getElementById('navToggle');
  var drawer = document.getElementById('navDrawer');
  var closeBtn = document.getElementById('navClose');
  var overlay = document.getElementById('navOverlay');
  if (!toggle || !drawer) return;

  function open() {
    drawer.classList.add('open');
    overlay.classList.add('show');
    toggle.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function close() {
    drawer.classList.remove('open');
    overlay.classList.remove('show');
    toggle.classList.remove('open');
    document.body.style.overflow = '';
  }

  toggle.addEventListener('click', function() {
    drawer.classList.contains('open') ? close() : open();
  });
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', close);
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
(function(){
  var hash = "c4d038b4bed09fdb1471ef51ec3a32cd";
  var input = document.getElementById('pwd-input');
  var btn = document.getElementById('pwd-btn');
  var err = document.getElementById('pwd-error');
  var gate = document.getElementById('vip-gate');
  var content = document.getElementById('vip-content');
  var statusText = document.getElementById('vip-status-text');
  var dot = document.querySelector('.zxy-dot');

  function unlock(){
    gate.style.display = 'none';
    content.classList.remove('zxy-locked');
    content.classList.add('zxy-unlocked');
    statusText.textContent = "GRANTED (已准入)";
    dot.classList.add('active');
  }

  function lock(){
    err.style.display = 'block';
    input.value = '';
    input.focus();
  }

  function verify(){
    var code = input.value.trim();
    if(!code) return;
    if(CryptoJS.MD5(code).toString() === hash){ unlock(); }
    else { lock(); }
  }

  btn.addEventListener('click', verify);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') verify(); });
})();
</script>

    <!-- Entry animation for list items -->
    <script>
    (function(){
      var items = document.querySelectorAll('.entries-list .list__item');
      if(!items.length) return;
      var io = new IntersectionObserver(function(entries) {
        entries.forEach(function(e, i) {
          if (e.isIntersecting) {
            setTimeout(function() { e.target.classList.add('visible'); }, i * 60);
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0.1 });
      items.forEach(function(item) { io.observe(item); });
    })();
    </script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据展示中心</title>
    <link rel="stylesheet" href="/assets/css/custom.css">
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(11, 17, 30, 0.75);
            --accent-color: #38bdf8;
            --unlock-color: #4ade80;
            --alert-color: #f87171;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: Menlo, Monaco, Consolas, monospace, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 24px;
        }
        .secure-container {
            max-width: 1360px;
            width: 100%;
            background: rgba(11, 17, 30, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 25px;
            margin-bottom: 25px;
        }
        .avatar {
            width: 85px; height: 85px;
            border-radius: 12px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid rgba(56, 189, 248, 0.3);
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-info h1 { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 6px; }
        .user-info p { color: var(--text-muted); font-size: 14px; }
        .tags { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
        .tag {
            background: rgba(56, 189, 248, 0.08);
            color: var(--accent-color);
            border: 1px solid rgba(56, 189, 248, 0.15);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            text-transform: uppercase;
        }
        .system-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
        }
        .dash-item { font-size: 12px; border-left: 2px solid rgba(56, 189, 248, 0.4); padding-left: 10px; }
        .dash-label { color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .dash-value { color: #fff; font-weight: bold; }
        .lock-zone {
            padding: 50px 30px;
            border: 1px solid rgba(245, 158, 11, 0.25);
            background: rgba(245, 158, 11, 0.02);
            border-radius: 12px;
            text-align: center;
            margin: 20px 0;
        }
        .lock-zone h3 { color: #fbbf24; font-size: 20px; margin-bottom: 12px; }
        .lock-sub { color: var(--text-muted); font-size: 13px; line-height: 1.6; max-width: 650px; margin: 0 auto; }
        .input-box { display: flex; justify-content: center; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
        .input-box input {
            background: #060911;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 18px;
            width: 320px;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: monospace;
        }
        .input-box input:focus { border-color: var(--accent-color); }
        .input-box button {
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .input-box button:hover { border-color: var(--accent-color); color: var(--accent-color); }
        .error-hint { color: var(--alert-color); font-size: 13px; margin-top: 18px; display: none; }
        .hidden-profile-grid { display: none; grid-template-columns: 1fr 1fr; gap: 30px; }
        .panel-column { display: flex; flex-direction: column; gap: 25px; }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid var(--unlock-color);
            padding-left: 12px;
            margin: 15px 0 12px;
        }
        .panel-column:nth-child(2) .section-header { border-left-color: var(--accent-color); }
        .section-title { color: #fff; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .info-grid {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 12px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.01);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .info-label { color: var(--text-muted); }
        .info-value { color: #e5e7eb; word-break: break-all; }
        @media (max-width: 1024px) {
            .hidden-profile-grid { grid-template-columns: 1fr; }
            body { padding: 12px; }
            .secure-container { padding: 20px 15px; }
            .input-box input { width: 100%; }
        }
    </style>
</head>

<script>

        function ad(x,y){var l=(x&0xffff)+(y&0xffff);var m=(x>>16)+(y>>16)+(l>>16);return(m<<16)|(l&0xffff);}
        function rl(n,c){return(n<<c)|(n>>>(32-c));}
        function cm(q,a,b,x,s,t){return ad(rl(ad(ad(a,q),ad(x,t)),s),b);}

        var S1=[7,12,17,22],S2=[5,9,14,20],S3=[4,11,16,23],S4=[6,10,15,21];

            a=ff(a,b,c,d,x[i+0],S1[0],0xd76aa478);d=ff(d,a,b,c,x[i+1],S1[1],0xe8c7b756);

            c=gg(c,d,a,b,x[i+3],S2[2],0xf4d50d87);b=gg(b,c,d,a,x[i+8],S2[3],0x455a14ed);

            c=gg(c,d,a,b,x[i+7],S2[2],0x676f02d9);b=gg(b,c,d,a,x[i+12],S2[3],0x8d2a4c8a);

            c=ii(c,d,a,b,x[i+2],S4[2],0x2ad7d2bb);b=ii(b,c,d,a,x[i+9],S4[3],0xeb86d391);

        }
        return rh(a)+rh(b)+rh(c)+rh(d);
    }

    var CORRECT_HASH = "9ff7888dd112d3e0";
    var inputField = document.getElementById('invite-code-input');
    var btn = document.getElementById('verify-btn');
    var error = document.getElementById('verify-error-msg');
    var dashTxt = document.getElementById('dash-status-txt');

    function verify() {
        var code = inputField.value.trim();
        if (!code) return;
        var hash32 = md5(code);
        var hash16 = hash32.substring(8, 24);
        if (hash16 === CORRECT_HASH) {
            error.style.display = 'none';
            document.getElementById('vip-gate').style.display = 'none';
            var grid = document.getElementById('vip-protected-content');
            grid.style.display = 'grid';
            dashTxt.textContent = "GRANTED (已成功准入)";
            dashTxt.style.color = "var(--unlock-color)";
        } else {
            error.style.display = 'block';
            inputField.value = '';
            inputField.focus();
        }
    }

    btn.addEventListener('click', verify);
    inputField.addEventListener('keypress', function(e) { if (e.key === 'Enter') verify(); });
})();
</script>

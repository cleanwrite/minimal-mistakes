<link rel="stylesheet" href="{{ '/assets/css/zxy.css' | relative_url }}">

<div class="zxy-wrap">
  <div class="zxy-header">
    <h1>数据展示中心</h1>
    <p>自动化基线环境分析与信息安全镜像仓</p>
    <span class="zxy-tag">等级：HIGH</span>
  </div>

  <div id="vip-gate" class="zxy-gate">
    <h3>🔒 鉴权验证</h3>
    <p>请输入访问密钥</p>
    <div class="zxy-input-row">
      <input type="password" id="pwd-input" placeholder="输入密钥..." autocomplete="off">
      <button id="pwd-btn">验证</button>
    </div>
    <p id="pwd-error" class="zxy-error">❌ 密钥不正确</p>
  </div>

  <div id="vip-content" class="zxy-locked">
    <div class="zxy-status">
      <span class="zxy-dot"></span>
      <span id="vip-status-text">RESTRICTED (等待准入)</span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
(function(){
  var hash = "c4d038b4bed09fdb1471ef51ec3a32cd";
  var input = document.getElementById('pwd-input');
  var btn = document.getElementById('pwd-btn');
  var err = document.getElementById('pwd-error');
  var gate = document.getElementById('vip-gate');
  var content = document.getElementById('vip-content');
  var statusText = document.getElementById('vip-status-text');
  var dot = document.querySelector('.zxy-dot');

  function unlock(){
    gate.style.display = 'none';
    content.classList.remove('zxy-locked');
    content.classList.add('zxy-unlocked');
    statusText.textContent = "GRANTED (已准入)";
    dot.classList.add('active');
  }

  function lock(){
    err.style.display = 'block';
    input.value = '';
    input.focus();
  }

  function verify(){
    var code = input.value.trim();
    if(!code) return;
    if(CryptoJS.MD5(code).toString() === hash){ unlock(); }
    else { lock(); }
  }

  btn.addEventListener('click', verify);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') verify(); });
})();
</script>

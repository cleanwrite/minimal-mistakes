<!-- Hidden payload source -->
<div id="vip-payload-source" style="display:none">{{ page.hidden_resource | markdownify }}</div>

<div id="vip-gate" class="vip-gate">
  <h3><i class="fas fa-key"></i> 内部内容：请输入专属验证码/密钥</h3>
  <p class="vip-gate__text">本帖的追加讨论与隐藏核心资源已被锁定，请输入有效的邀请码或密钥进行解锁。</p>
  <div class="vip-gate__form">
    <input type="password" id="invite-code-input" placeholder="请输入密钥..." />
    <button id="verify-btn">验证解锁</button>
  </div>
  <p id="verify-error-msg" class="vip-gate__error"><i class="fas fa-exclamation-triangle"></i> 密钥无效或已过期，请重新输入！</p>
</div>

<div id="vip-protected-content" class="vip-content" style="display:none;">
  <h4><i class="fas fa-unlock"></i> 验证成功！以下为隐藏讨论与核心资源</h4>
  <div id="vip-payload-output" class="vip-content__body"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
(function() {
  var correctHash = "{{ page.invite_code_hash }}";
  var verifyBtn = document.getElementById('verify-btn');
  var inputField = document.getElementById('invite-code-input');
  if (!verifyBtn || !inputField) return;

  function doVerify() {
    var inputCode = inputField.value.trim();
    if (!inputCode) return;
    var errorMsg = document.getElementById('verify-error-msg');
    var inputHash = CryptoJS.MD5(inputCode).toString();
    if (inputHash === correctHash) {
      errorMsg.style.display = 'none';
      document.getElementById('vip-gate').style.display = 'none';
      document.getElementById('vip-protected-content').style.display = 'block';
      var src = document.getElementById('vip-payload-source');
      var out = document.getElementById('vip-payload-output');
      out.innerHTML = src.innerHTML;
    } else {
      errorMsg.style.display = 'block';
      inputField.value = '';
      inputField.focus();
    }
  }

  verifyBtn.addEventListener('click', doVerify);
  inputField.addEventListener('keypress', function(e) { if (e.key === 'Enter') doVerify(); });
})();
</script>

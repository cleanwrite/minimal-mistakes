<script>
  'use strict';

  (function () {
    var commentContainer = document.querySelector('#giscus-comments');

    if (!commentContainer) {
      return;
    }

    // 清空可能存在的旧内容（防止重复渲染）
    commentContainer.innerHTML = '';

    // 1. 创建并注入密码验证墙的 HTML 结构
    var gateDiv = document.createElement('div');
    gateDiv.id = 'vip-gate';
    gateDiv.style.cssText = 'margin-top: 2.5em; padding: 25px; border: 2px dashed #f0ad4e; background-color: #fcf8e3; border-radius: 6px; text-align: center;';
    gateDiv.innerHTML =
      '<h3 style="margin-top: 0; color: #8a6d3b;"><i class="fas fa-key"></i> 内部内容：请输入专属验证码/密钥</h3>' +
      '<p style="color: #66512c; font-size: 0.95em;">本帖的追加讨论与隐藏核心资源已被锁定，请输入有效的邀请码或密钥进行解锁。</p>' +
      '<div style="margin: 20px 0;">' +
        '<input type="password" id="invite-code-input" placeholder="请输入密钥..." style="padding: 10px; width: 260px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;" />' +
        '<button id="verify-btn" style="padding: 10px 20px; background-color: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-left: 10px;">验证解锁</button>' +
      '</div>' +
      '<p id="verify-error-msg" style="color: #d9534f; display: none; font-weight: bold; margin-top: 10px;"><i class="fas fa-exclamation-triangle"></i> 密钥无效或已过期，请重新输入！</p>';

    // 2. 创建验证成功后用于展示内容的容器
    var contentDiv = document.createElement('div');
    contentDiv.id = 'vip-protected-content';
    contentDiv.style.cssText = 'display: none; margin-top: 2.5em; padding: 25px; border-left: 5px solid #5cb85c; background-color: #f4f9f4; border-radius: 6px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);';
    contentDiv.innerHTML =
      '<h4 style="color: #3c763d; margin-top: 0; margin-bottom: 15px;"><i class="fas fa-unlock"></i> 验证成功！以下为隐藏讨论与核心资源</h4>' +
      '<div id="decrypted-payload"></div>';

    // 将这些元素塞入评论区容器中
    commentContainer.appendChild(gateDiv);
    commentContainer.appendChild(contentDiv);

    // 3. 内联 MD5 实现（无外部依赖，不受 CSP 限制）
    function md5(string) {
      function rotateLeft(val, shift) { return (val << shift) | (val >>> (32 - shift)); }
      function addUnsigned(x, y) { return (x & 0x7fffffff) + (y & 0x7fffffff) ^ (x & 0x80000000) ^ (y & 0x80000000); }
      function F(x, y, z) { return (x & y) | (~x & z); }
      function G(x, y, z) { return (x & z) | (y & ~z); }
      function H(x, y, z) { return x ^ y ^ z; }
      function I(x, y, z) { return y ^ (x | ~z); }
      function FF(a, b, c, d, x, s, ac) { a = addUnsigned(a, addUnsigned(addUnsigned(F(b, c, d), x), ac)); return addUnsigned(rotateLeft(a, s), b); }
      function GG(a, b, c, d, x, s, ac) { a = addUnsigned(a, addUnsigned(addUnsigned(G(b, c, d), x), ac)); return addUnsigned(rotateLeft(a, s), b); }
      function HH(a, b, c, d, x, s, ac) { a = addUnsigned(a, addUnsigned(addUnsigned(H(b, c, d), x), ac)); return addUnsigned(rotateLeft(a, s), b); }
      function II(a, b, c, d, x, s, ac) { a = addUnsigned(a, addUnsigned(addUnsigned(I(b, c, d), x), ac)); return addUnsigned(rotateLeft(a, s), b); }
      function convertToWordArray(str) {
        var len = str.length;
        var numWords = ((len + 8) >>> 6) + 1;
        var words = new Array(numWords * 16).fill(0);
        for (var i = 0; i < len; i++) words[i >>> 2] |= str.charCodeAt(i) << ((i % 4) * 8);
        words[len >>> 2] |= 0x80 << ((len % 4) * 8);
        words[(numWords * 16) - 2] = len * 8;
        return words;
      }
      function wordToHex(val) {
        var hex = '';
        for (var i = 0; i <= 3; i++) hex += ('0123456789abcdef'.charAt((val >>> (i * 8 + 4)) & 0x0f) + '0123456789abcdef'.charAt((val >>> (i * 8)) & 0x0f));
        return hex;
      }
      function utf8Encode(str) { return unescape(encodeURIComponent(str)); }
      var x = convertToWordArray(utf8Encode(string));
      var a = 0x67452301, b = 0xefcdab89, c = 0x98badcfe, d = 0x10325476;
      var S11=7, S12=12, S13=17, S14=22, S21=5, S22=9, S23=14, S24=20, S31=4, S32=11, S33=16, S34=23, S41=6, S42=10, S43=15, S44=21;
      for (var k = 0; k < x.length; k += 16) {
        var AA = a, BB = b, CC = c, DD = d;
        a = FF(a, b, c, d, x[k+0], S11, 0xd76aa478); d = FF(d, a, b, c, x[k+1], S12, 0xe8c7b756);
        c = FF(c, d, a, b, x[k+2], S13, 0x242070db); b = FF(b, c, d, a, x[k+3], S14, 0xc1bdceee);
        a = FF(a, b, c, d, x[k+4], S11, 0xf57c0faf); d = FF(d, a, b, c, x[k+5], S12, 0x4787c62a);
        c = FF(c, d, a, b, x[k+6], S13, 0xa8304613); b = FF(b, c, d, a, x[k+7], S14, 0xfd469501);
        a = FF(a, b, c, d, x[k+8], S11, 0x698098d8); d = FF(d, a, b, c, x[k+9], S12, 0x8b44f7af);
        c = FF(c, d, a, b, x[k+10], S13, 0xffff5bb1); b = FF(b, c, d, a, x[k+11], S14, 0x895cd7be);
        a = FF(a, b, c, d, x[k+12], S11, 0x6b901122); d = FF(d, a, b, c, x[k+13], S12, 0xfd987193);
        c = FF(c, d, a, b, x[k+14], S13, 0xa679438e); b = FF(b, c, d, a, x[k+15], S14, 0x49b40821);
        a = GG(a, b, c, d, x[k+1], S21, 0xf61e2562); d = GG(d, a, b, c, x[k+6], S22, 0xc040b340);
        c = GG(c, d, a, b, x[k+11], S23, 0x265e5a51); b = GG(b, c, d, a, x[k+0], S24, 0xe9b6c7aa);
        a = GG(a, b, c, d, x[k+5], S21, 0xd62f105d); d = GG(d, a, b, c, x[k+10], S22, 0x2441453);
        c = GG(c, d, a, b, x[k+15], S23, 0xd8a1e681); b = GG(b, c, d, a, x[k+4], S24, 0xe7d3fbc8);
        a = GG(a, b, c, d, x[k+9], S21, 0x21e1cde6); d = GG(d, a, b, c, x[k+14], S22, 0xc33707d6);
        c = GG(c, d, a, b, x[k+3], S23, 0xf4d50d87); b = GG(b, c, d, a, x[k+8], S24, 0x455a14ed);
        a = GG(a, b, c, d, x[k+13], S21, 0xa9e3e905); d = GG(d, a, b, c, x[k+2], S22, 0xfce3f3e0);
        c = GG(c, d, a, b, x[k+7], S23, 0x676f02d9); b = GG(b, c, d, a, x[k+12], S24, 0x8d2a4c8a);
        a = HH(a, b, c, d, x[k+5], S31, 0xfffa3942); d = HH(d, a, b, c, x[k+8], S32, 0x8771f681);
        c = HH(c, d, a, b, x[k+11], S33, 0x6d9d6122); b = HH(b, c, d, a, x[k+14], S34, 0xfde5380c);
        a = HH(a, b, c, d, x[k+1], S31, 0xa4beea44); d = HH(d, a, b, c, x[k+4], S32, 0x4bdecfa9);
        c = HH(c, d, a, b, x[k+7], S33, 0xf6bb4b60); b = HH(b, c, d, a, x[k+10], S34, 0xbebfbc70);
        a = HH(a, b, c, d, x[k+13], S31, 0x289b7ec6); d = HH(d, a, b, c, x[k+0], S32, 0xeaa127fa);
        c = HH(c, d, a, b, x[k+3], S33, 0xd4ef3085); b = HH(b, c, d, a, x[k+6], S34, 0x4881d05);
        a = HH(a, b, c, d, x[k+9], S31, 0xd9d4d039); d = HH(d, a, b, c, x[k+12], S32, 0xe6db99e5);
        c = HH(c, d, a, b, x[k+15], S33, 0x1fa27cf8); b = HH(b, c, d, a, x[k+2], S34, 0xc4ac5665);
        a = II(a, b, c, d, x[k+0], S41, 0xf4292244); d = II(d, a, b, c, x[k+7], S42, 0x432aff97);
        c = II(c, d, a, b, x[k+14], S43, 0xab9423a7); b = II(b, c, d, a, x[k+5], S44, 0xfc93a039);
        a = II(a, b, c, d, x[k+12], S41, 0x655b59c3); d = II(d, a, b, c, x[k+3], S42, 0x8f0ccc92);
        c = II(c, d, a, b, x[k+10], S43, 0xffeff47d); b = II(b, c, d, a, x[k+1], S44, 0x85845dd1);
        a = II(a, b, c, d, x[k+8], S41, 0x6fa87e4f); d = II(d, a, b, c, x[k+15], S42, 0xfe2ce6e0);
        c = II(c, d, a, b, x[k+6], S43, 0xa3014314); b = II(b, c, d, a, x[k+13], S44, 0x4e0811a1);
        a = II(a, b, c, d, x[k+4], S41, 0xf7537e82); d = II(d, a, b, c, x[k+11], S42, 0xbd3af235);
        c = II(c, d, a, b, x[k+2], S43, 0x2ad7d2bb); b = II(b, c, d, a, x[k+9], S44, 0xeb86d391);
        a = addUnsigned(a, AA); b = addUnsigned(b, BB); c = addUnsigned(c, CC); d = addUnsigned(d, DD);
      }
      return (wordToHex(a) + wordToHex(b) + wordToHex(c) + wordToHex(d)).toLowerCase();
    }

    // 4. 验证逻辑
    var verifyBtn = document.getElementById('verify-btn');
    var inputField = document.getElementById('invite-code-input');

    if (verifyBtn && inputField) {
      function doVerify() {
        var inputCode = inputField.value.trim();
        var errorMsg = document.getElementById('verify-error-msg');

        // 从当前文章的 Front Matter 中自动读取预设的邀请码 MD5 散列值
        var correctHash = "{{ page.invite_code_hash }}";

        if (!correctHash) {
          alert("这篇文章没有设置邀请码密钥。");
          return;
        }

        // 计算用户输入的邀请码的 MD5 值
        var inputHash = md5(inputCode);

        if (inputHash === correctHash) {
          errorMsg.style.display = 'none';
          document.getElementById('vip-gate').style.display = 'none';
          document.getElementById('vip-protected-content').style.display = 'block';

          // 将 Jekyll 渲染出的 HTML 转为纯文本字符串注入
          var payload = {{ page.hidden_resource | markdownify | jsonify }};
          var payloadContainer = document.getElementById('decrypted-payload');

          // 强制连续的长英文字符与长链接在容器边缘自动折行，防止撑爆文本框
          payloadContainer.style.cssText = 'word-break: break-all; word-wrap: break-word; line-height: 1.6; font-size: 15px;';
          payloadContainer.innerHTML = payload;
        } else {
          errorMsg.style.display = 'block';
          inputField.value = '';
          inputField.focus();
        }
      }

      // 绑定点击事件
      verifyBtn.addEventListener('click', doVerify);

      // 绑定回车键监听
      inputField.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          doVerify();
        }
      });
    }
  })();
</script>

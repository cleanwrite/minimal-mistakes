<!-- start custom head snippets -->

<!-- 预加载背景图，确保 loader 能快速显示 -->
<link rel="preload" as="image" href="/assets/images/wall.webp">

<!-- 移动端视口 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

<!-- 主题色 -->
<meta name="theme-color" content="#e07b39">

<!-- 加载动画脚本：背景图 ready 后立刻消散 -->
<script>
(function() {
  var loader = document.getElementById('loader');
  if (!loader) return;

  function dismiss() {
    loader.classList.add('done');
    setTimeout(function() { loader.remove(); }, 800);
  }

  // 背景图加载完就关，没加载也等 3 秒兜底
  var bgImg = new Image();
  bgImg.onload = dismiss;
  bgImg.onerror = dismiss;
  bgImg.src = '/assets/images/wall.webp';

  setTimeout(function() {
    if (loader && !loader.classList.contains('done')) dismiss();
  }, 3000);
})();
</script>

<!-- end custom head snippets -->
<link rel="stylesheet" href="/assets/css/custom.css">
